<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meu Controle Financeiro</title>
<style>
:root{--bg:#f5f7f6;--card:#fff;--tx:#1f2937;--mu:#6b7280;--bd:#e5e7eb;--g:#16a34a;--r:#dc2626;--y:#d97706;--b:#2563eb;--gs:#dcfce7;--rs:#fee2e2;--ys:#fef3c7;--bs:#dbeafe;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111827;--card:#1f2937;--tx:#f3f4f6;--mu:#9ca3af;--bd:#374151;--gs:#14532d;--rs:#7f1d1d;--ys:#78350f;--bs:#1e3a8a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111827;--card:#1f2937;--tx:#f3f4f6;--mu:#9ca3af;--bd:#374151;--gs:#14532d;--rs:#7f1d1d;--ys:#78350f;--bs:#1e3a8a;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;display:flex;min-height:100vh}
aside{width:200px;background:var(--card);border-right:1px solid var(--bd);padding:16px 10px;position:sticky;top:0;height:100vh;flex:none}
aside h1{font-size:16px;color:var(--g);margin:0 8px 14px}
.nb{display:flex;gap:8px;align-items:center;width:100%;border:0;background:none;color:var(--tx);padding:9px 10px;border-radius:10px;cursor:pointer;font:inherit;text-align:left}
.nb.on{background:var(--gs);color:var(--g);font-weight:600}
main{flex:1;min-width:0;padding:16px 16px 90px;max-width:1000px;margin:0 auto}
header{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
header h2{margin:0;flex:1;font-size:20px}
input,select{font:inherit;padding:9px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);width:100%}
header input,header select{width:auto}
.btn{background:var(--g);color:#fff;border:0;padding:9px 14px;border-radius:10px;cursor:pointer;font:inherit;font-weight:600}
.btn.s{background:var(--card);color:var(--tx);border:1px solid var(--bd);font-weight:400;padding:6px 10px;font-size:13px}
.btn.d{background:var(--rs);color:var(--r);border:0;padding:6px 10px;font-size:13px;font-weight:400}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.grid .card{margin:0}.k{font-size:12px;color:var(--mu)}.v{font-size:20px;font-weight:700;margin-top:2px}
.g{color:var(--g)}.r{color:var(--r)}.y{color:var(--y)}.b{color:var(--b)}
.tip{background:var(--bs);color:var(--tx);border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:14px}
.row{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--bd);flex-wrap:wrap}
.row:last-child{border:0}.row .i{flex:1;min-width:140px}.row small{color:var(--mu);display:block}
.tag{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--gs);color:var(--g)}
.tag.p{background:var(--ys);color:var(--y)}.tag.v{background:var(--rs);color:var(--r)}
.bar{height:10px;background:var(--bd);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;border-radius:99px}
.bl{display:grid;grid-template-columns:110px 1fr 90px;gap:8px;align-items:center;margin:7px 0;font-size:13px}
.bl span:last-child{text-align:right}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
h3{margin:0 0 8px;font-size:15px}.ex{color:var(--mu);font-size:13px;margin:0 0 8px}
#m{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:14px;z-index:30}
#m>div{background:var(--card);border-radius:16px;padding:18px;width:100%;max-width:420px;max-height:90vh;overflow:auto}
label{display:block;font-size:13px;margin:10px 0 3px;font-weight:600}label small{font-weight:400;color:var(--mu)}
nav.bt{display:none;position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);overflow-x:auto;padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px));z-index:20}
nav.bt button{flex:none;border:0;background:none;color:var(--mu);font-size:11px;padding:4px 10px;display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer}
nav.bt button.on{color:var(--g);font-weight:700}
/* Ganhos — cadastro manual, sem conexão bancária */
.gain-top{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:0 0 16px}
.gain-top .card{margin:0}
.gain-label{font-size:12px;color:var(--mu);margin-bottom:4px}
.gain-value{font-size:clamp(17px,2.3vw,23px);font-weight:750;letter-spacing:-.02em}
.gain-form-head,.gain-list-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.gain-form-head h3,.gain-list-head h3{margin:0;font-size:16px}
.gain-fields{display:grid;grid-template-columns:minmax(0,2fr) minmax(130px,1fr);gap:11px 14px}
.gain-fields .field{min-width:0}
.gain-fields .field label{margin:0 0 5px}
.gain-fields input,.gain-fields select{min-height:43px}
.gain-actions{display:flex;justify-content:flex-end;margin-top:15px}
.gain-actions .btn{min-height:42px;min-width:150px}
.gain-entry{display:flex;align-items:center;gap:12px;padding:13px 0;border-top:1px solid var(--bd);flex-wrap:wrap}
.gain-entry:first-of-type{border-top:0}
.gain-entry-info{flex:1;min-width:130px}
.gain-entry-info strong{display:block;margin-bottom:3px;overflow-wrap:anywhere}
.gain-entry-info small{display:block;color:var(--mu)}
.gain-entry-right{text-align:right;min-width:110px}
.gain-entry-right b{display:block;font-size:17px}
.gain-entry-buttons{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.gain-entry-buttons .btn{white-space:nowrap}
.gain-empty{text-align:center;padding:26px 10px;color:var(--mu);font-size:14px}
.gain-pill{font-size:11px;padding:3px 8px;border-radius:99px;background:var(--gs);color:var(--g);display:inline-block;margin-top:4px}
.gain-pill.waiting{background:var(--ys);color:var(--y)}
#mainAdd[hidden]{display:none!important}
@media(max-width:580px){
 .gain-top{gap:7px}
 .gain-top .card{padding:11px}
 .gain-label{font-size:11px}
 .gain-value{font-size:clamp(14px,3.8vw,19px)}
 .gain-fields{grid-template-columns:1fr 1fr;gap:10px}
 .gain-fields .field:nth-child(1){grid-column:1/-1}
 .gain-entry{gap:8px}
 .gain-entry-buttons{width:100%}
 .gain-entry-buttons .btn{flex:1}
 .gain-actions .btn{width:100%}
}
@media(max-width:760px){aside{display:none}nav.bt{display:flex}.bl{grid-template-columns:90px 1fr 80px}}


/* A plataforma só aparece após o login autenticado no Worker. */
body.auth-locked aside,body.auth-locked main,body.auth-locked nav.bt{display:none!important}
.login-screen{position:fixed;inset:0;z-index:90;background:linear-gradient(150deg,#0d3526,#0f6b41);display:flex;align-items:center;justify-content:center;padding:20px;overflow:auto}
.login-screen[hidden]{display:none!important}
.login-box{width:100%;max-width:425px;border-radius:20px;padding:28px;background:var(--card);color:var(--tx);box-shadow:0 16px 55px #0004}
.login-mark{font-size:32px;margin-bottom:6px}.login-box h1{font-size:24px;margin:0 0 6px}.login-box p{color:var(--mu);font-size:14px;margin:4px 0 14px}
.login-box label{font-size:13px;margin:12px 0 5px}.login-box select,.login-box input{min-height:44px;width:100%}
.login-box button{width:100%;margin-top:16px;min-height:44px}
.login-box details{border-top:1px solid var(--bd);margin-top:20px;padding-top:16px}
.login-box summary{font-size:13px;cursor:pointer;color:var(--mu)}
.login-error{font-size:13px;padding:10px;background:var(--rs);color:var(--r);border-radius:10px;margin-top:12px}
#loginMessage:empty{display:none}.session-pill{font-size:13px;color:var(--mu);white-space:nowrap}
@media(max-width:760px){.login-box{padding:22px}.session-pill{display:none}}
#manageUsersButton[hidden]{display:none!important} main header .btn.s{white-space:nowrap} @media(max-width:760px){main header .btn.s{padding:7px;font-size:12px}}
</style></head><body class="auth-locked">

<section id="loginScreen" class="login-screen" aria-label="Autenticação do Meu Controle Financeiro">
 <div class="login-box">
  <div class="login-mark">💚</div><h1>Meu Controle Financeiro</h1>
  <p>Entre no seu espaço pessoal. Cada perfil tem seus próprios lançamentos financeiros.</p>
  <form id="loginForm">
   <label for="loginWho">Nome de usuário</label>
   <input id="loginWho" type="text" maxlength="32" minlength="3" autocomplete="username" required placeholder="Digite seu usuário (ex.: Leandro)">
   <label for="loginPassword">Senha</label>
   <input id="loginPassword" type="password" autocomplete="current-password" required placeholder="Sua senha pessoal">
   <button class="btn" type="submit" id="loginButton">Entrar no meu controle</button>
  </form>
  <div id="loginMessage" aria-live="polite"></div>
  <p style="font-size:12px;margin-top:17px">Para criar outro usuário, entre como administrador e abra <b>Usuários</b>. Não é necessária uma SETUP_KEY.</p>
 </div>
</section>
<aside><h1>💚 Meu Controle Financeiro</h1><div id="sn"></div></aside>
<main><header><h2 id="ti"></h2><span id="sessionName" class="session-pill"></span><button class="btn s" onclick="openMyProfile()" title="Alterar meu nome de usuário">Meu perfil</button><button class="btn s" id="manageUsersButton" hidden onclick="openManageUsers()">Usuários</button><button class="btn s" onclick="logoutUser()" title="Sair do perfil">Sair</button><input type="month" id="ym"><button class="btn" id="mainAdd" onclick="addAny()">+ Adicionar</button></header><div id="v"></div></main>
<nav class="bt" id="bn"></nav><div id="m"><div id="mb"></div></div>
<script>
const KEY="mcf_v1"; // Legado local: não será importado automaticamente para a Ray.
const def=()=>({rec:[],fix:[],var:[],car:[],cmp:[],div:[],res:[]});
const normalizeS=data=>{
 const a=Object.assign(def(),data&&typeof data==='object'?data:{});
 for(const k of ['rec','fix','var','car','cmp','div','res'])if(!Array.isArray(a[k]))a[k]=[];
 return a;
};
let S=normalizeS({}); // Somente os dados da conta autenticada são carregados.
const API_BASE='https://meu-controle-financeiro-api.leandrocmrg001.workers.dev';
let authToken='',authUser='',authDisplayName='',authIsAdmin=false,stateRevision=0,saveTimer=null,saveInProgress=false,dirty=false,saveConflict=false;
const SESSION_KEY='mcf_auth_token';
async function apiRequest(path,options={}){
 const headers={'Content-Type':'application/json',...(authToken?{'Authorization':'Bearer '+authToken}:{}),...(options.headers||{})};
 let response;
 try{response=await fetch(API_BASE+path,{...options,headers,cache:'no-store'});}catch{throw new Error('Não foi possível alcançar o Cloudflare. Verifique a conexão.');}
 let out={};try{out=await response.json();}catch{}
 if(!response.ok)throw new Error(out.error||('Erro HTTP '+response.status));
 return out;
}
function showLoginError(err){const box=document.getElementById('loginMessage');box.textContent=String(err?.message||err||'');box.className='login-error';}
async function authActivate(token){
 authToken=token;
 try{
  const me=await apiRequest('/auth/me');
  const stored=await apiRequest('/state');
  S=normalizeS(stored.data);stateRevision=stored.revision||0;
  authUser=me.user?.login||'';authDisplayName=me.user?.nome||authUser;authIsAdmin=!!me.user?.isAdmin;saveConflict=false;dirty=false;
  sessionStorage.setItem(SESSION_KEY,token);
  document.body.classList.remove('auth-locked');document.getElementById('loginScreen').hidden=true;
  document.getElementById('sessionName').textContent=authDisplayName;document.getElementById('manageUsersButton').hidden=!authIsAdmin;
  go();
  // Nunca importa os dados antigos do navegador sem autorização explícita.
  if(authIsAdmin)offerLegacyImport();
 }catch(e){authToken='';sessionStorage.removeItem(SESSION_KEY);throw e;}
}
async function performLogin(event){
 event.preventDefault();const btn=document.getElementById('loginButton');btn.disabled=true;
 try{
  const r=await apiRequest('/auth/login',{method:'POST',body:JSON.stringify({login:document.getElementById('loginWho').value.trim(),password:document.getElementById('loginPassword').value})});
  document.getElementById('loginPassword').value='';await authActivate(r.token);
 }catch(e){showLoginError(e)}finally{btn.disabled=false;}
}
// O administrador cria novos usuários após autenticar-se (sem chave SETUP_KEY).
const usernameValid = v => /^[\p{L}\p{N}][\p{L}\p{N}._-]{2,31}$/u.test(String(v||'').trim());
function openManageUsers(){
 if(!authIsAdmin)return;
 open_(`<h3>👥 Criar novo usuário</h3><p class="ex">Cada pessoa tem seus próprios lançamentos.</p>
 <label for="newUsername">Nome de usuário</label><input id="newUsername" type="text" minlength="3" maxlength="32" autocomplete="off" placeholder="Ex.: Ray" aria-describedby="userNameHelp">
 <p id="userNameHelp" class="ex">De 3 a 32 caracteres; letras, números, ponto, hífen ou sublinhado. Sem espaços.</p>
 <label for="newUserPassword">Senha do novo usuário</label><input id="newUserPassword" type="password" minlength="12" maxlength="128" autocomplete="new-password" placeholder="Mínimo de 12 caracteres">
 <div style="display:flex;gap:8px;margin-top:16px;flex-wrap:wrap"><button class="btn" id="createUserButton" onclick="createNewUser()">Criar usuário</button><button class="btn s" onclick="close_()">Cancelar</button></div>`);
}
async function createNewUser(){
 const name=document.getElementById('newUsername')?.value.trim()||'';
 const password=document.getElementById('newUserPassword')?.value||'';
 if(!usernameValid(name))return er('Use de 3 a 32 caracteres sem espaços.');
 if(password.length<12)return er('A senha precisa ter pelo menos 12 caracteres.');
 const btn=document.getElementById('createUserButton');btn.disabled=true;
 try{
  await apiRequest('/auth/users',{method:'POST',body:JSON.stringify({login:name,password})});
  close_();alert('Usuário criado! Agora ele já pode entrar com seu nome e senha.');
 }catch(e){er(e.message)}finally{btn.disabled=false;}
}
function openMyProfile(){
 open_(`<h3>✏️ Alterar nome de usuário</h3><p class="ex">Seus registros continuam vinculados ao mesmo perfil.</p>
 <label for="profileUsername">Novo nome de usuário</label><input id="profileUsername" type="text" minlength="3" maxlength="32" autocomplete="username" value="${E(authDisplayName)}">
 <label for="profilePassword">Sua senha atual para confirmar</label><input id="profilePassword" type="password" autocomplete="current-password" placeholder="Senha atual">
 <div style="display:flex;gap:8px;margin-top:16px;flex-wrap:wrap"><button class="btn" id="renameUserButton" onclick="renameMyUser()">Salvar nome</button><button class="btn s" onclick="close_()">Cancelar</button></div><p class="ex" style="margin-top:15px"><button class="btn s" onclick="backupDados()">Baixar backup dos meus dados</button></p>`);
}
async function renameMyUser(){
 const name=document.getElementById('profileUsername')?.value.trim()||'';
 const password=document.getElementById('profilePassword')?.value||'';
 if(!usernameValid(name))return er('Use de 3 a 32 caracteres sem espaços.');
 if(!password)return er('Digite sua senha atual.');
 const btn=document.getElementById('renameUserButton');btn.disabled=true;
 try{
  const result=await apiRequest('/auth/profile',{method:'PUT',body:JSON.stringify({login:name,password})});
  authUser=result.user.login;authDisplayName=result.user.nome;
  document.getElementById('sessionName').textContent=authDisplayName;
  close_();go();
 }catch(e){er(e.message)}finally{btn.disabled=false;}
}
function offerLegacyImport(){
 if(!localStorage.getItem(KEY)||S.__legacyImported)return;
 let legacy;try{legacy=JSON.parse(localStorage.getItem(KEY));}catch{return;}
 if(!legacy||![...(legacy.rec||[]),...(legacy.fix||[]),...(legacy.var||[])].length)return;
 // Dados antigos permanecem no navegador; o usuário escolhe se quer migrar.
 open_('<h3>Importar registros antigos deste navegador?</h3><p>Encontrei registros da versão anterior neste navegador. Eles NÃO foram incluídos na conta nova. Faça backup antes de importar.</p><button class="btn" onclick="importLegacyForLeandro()">Importar meus dados antigos</button> <button class="btn s" onclick="close_()">Agora não</button>');
}
function importLegacyForLeandro(){
 if(!authIsAdmin||S.__legacyImported)return;
 const raw=localStorage.getItem(KEY);let old;
 try{old=normalizeS(JSON.parse(raw));}catch{return;}
 if(!confirm('Confirma que esses registros pertencem a este perfil? O histórico atual será substituído.'))return;
 S=old;S.__legacyImported=true;save();close_();go();
}
async function flushSave(){
 if(saveInProgress||!dirty||!authToken||saveConflict)return;
 saveInProgress=true;dirty=false;
 const snapshot=JSON.stringify(S);
 try{
  const result=await apiRequest('/state',{method:'PUT',body:JSON.stringify({revision:stateRevision,data:JSON.parse(snapshot)})});
  stateRevision=result.revision;
 }catch(e){
  saveConflict=true;dirty=true;
  alert('Os dados não foram salvos na nuvem: '+e.message+' Faça um backup JSON e não feche a página até resolver.');
 }finally{saveInProgress=false;if(dirty&&!saveConflict)setTimeout(flushSave,120);}
}
function queueStateSave(){if(!authToken)return;dirty=true;clearTimeout(saveTimer);saveTimer=setTimeout(flushSave,450);}
async function logoutUser(){
 if(dirty||saveInProgress){clearTimeout(saveTimer);await flushSave();for(let n=0;n<40&&saveInProgress;n++)await new Promise(r=>setTimeout(r,50));}
 if(dirty||saveInProgress||saveConflict){alert('Existem alterações sem salvar. Exporte o backup JSON antes de sair.');return;}
 try{await apiRequest('/auth/logout',{method:'POST'})}catch{}
 authToken='';authUser='';authDisplayName='';authIsAdmin=false;document.getElementById('manageUsersButton').hidden=true;S=normalizeS({});sessionStorage.removeItem(SESSION_KEY);
 document.body.classList.add('auth-locked');document.getElementById('loginScreen').hidden=false;document.getElementById('loginPassword').value='';
}
async function authBoot(){
 document.getElementById('loginForm').addEventListener('submit',performLogin);
 const token=sessionStorage.getItem(SESSION_KEY);
 if(token){try{await authActivate(token)}catch(e){showLoginError(e);}}
}

const save=()=>queueStateSave();
const now=new Date(),loc=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");
let ym=loc(now),tab="dash";const today=loc(now)+"-"+String(now.getDate()).padStart(2,"0");
const $=s=>document.querySelector(s),R=v=>(+v||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"}),D=d=>d?d.split("-").reverse().join("/"):"",uid=()=>Math.random().toString(36).slice(2,9);
const E=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const mi=y=>+y.slice(0,4)*12+ +y.slice(5,7)-1,fm=n=>Math.floor(n/12)+"-"+String(n%12+1).padStart(2,"0");
const MN=["Jan","Fev","Mar","Abr","Mai","Jun","Jul","Ago","Set","Out","Nov","Dez"];
const sum=a=>a.reduce((s,x)=>s+(+x.valor||0),0);
const CR=["Salário","Comissão","Hora extra","Benefício","Renda extra","Outros ganhos"],CV=["Mercado","Alimentação","Transporte","Combustível","Farmácia","Lazer","Compras","Delivery","Outros"],CF=["Aluguel","Condomínio","Água","Energia","Internet","Telefone","Assinatura","Mensalidade","Seguro","Outra fixa"];
const NAV=[["dash","📊","Início"],["rec","💰","Ganhos"],["fix","🏠","Gastos fixos"],["var","🛒","Gastos variáveis"],["car","💳","Cartões"],["div","📉","Dívidas"],["pag","🗓️","Contas a pagar"],["res","🐷","Reserva"],["rel","📈","Relatórios"]];
const T={rec:"Meus ganhos",fix:"Gastos fixos",var:"Gastos variáveis",car:"Cartões de crédito",div:"Minhas dívidas",pag:"Contas a pagar",res:"Reserva financeira",rel:"Relatórios",dash:"Visão geral"};
const FR=[["unica","Única"],["mensal","Mensal"]];
const F={
rec:{t:"Ganho",f:[["desc","Descrição","text","Ex.: Salário da empresa"],["valor","Valor (R$)","number",""],["data","Data de recebimento","date"],["cat","Categoria","select",CR],["freq","Recorrência","select",FR],["st","Situação","select",[["0","Previsto"],["1","Recebido"]]]]},
fix:{t:"Gasto fixo",f:[["desc","Descrição","text","Ex.: Aluguel"],["valor","Valor (R$)","number"],["data","Primeiro vencimento","date"],["freq","Frequência","select",[["mensal","Mensal"],["anual","Anual"],["unica","Única"]]],["cat","Tipo","select",CF],["st","Situação","select",[["0","Pendente"],["1","Pago"]]]]},
var:{t:"Gasto variável",f:[["desc","Descrição","text","Ex.: Compras do mês"],["valor","Valor (R$)","number"],["data","Data","date"],["cat","Categoria","select",CV]]},
car:{t:"Cartão",f:[["nome","Nome do cartão","text","Ex.: Nubank"],["banco","Banco ou instituição","text"],["limite","Limite total (R$)","number"],["fech","Dia de fechamento","number","Dia em que a fatura fecha (1 a 28)"],["venc","Dia de vencimento","number","Dia em que você paga a fatura"]]},
cmp:{t:"Compra no cartão",f:[["cid","Cartão","card"],["desc","Descrição","text","Ex.: Geladeira"],["valor","Valor total (R$)","number"],["parc","Nº de parcelas","number","1 se for à vista"],["data","Data da compra","date"]]},
div:{t:"Dívida",f:[["nome","Nome da dívida","text","Ex.: Financiamento do carro"],["inst","Instituição","text"],["orig","Valor original (R$)","number"],["parcela","Valor da parcela (R$)","number"],["total","Total de parcelas","number"],["pagas","Parcelas já pagas","number","Use 0 se ainda não pagou nenhuma"],["juros","Juros ao mês (%)","number","Opcional"],["data","Primeiro vencimento","date"]]},
res:{t:"Reserva",f:[["nome","Nome da reserva","text","Ex.: Reserva de emergência"],["obj","Objetivo","text","Ex.: 6 meses de despesas"],["meta","Valor desejado (R$)","number"],["atual","Valor atual (R$)","number"],["contrib","Contribuição mensal (R$)","number"]]}};
// ---- cálculos

function addAny(){
 if(F[tab]&&tab!=='car')return add(tab);
 if(tab==='car')return add('car');
 open_('<h3>Adicionar lançamento</h3>'+['rec','fix','var','car','cmp','div','res'].map(k=>`<button class="btn s" style="display:block;width:100%;margin:6px 0;padding:10px" onclick="close_();add('${k}')">${F[k].t}</button>`).join(''));
}
function baixarArquivo(nome,conteudo,tipo){
 const blob=new Blob([conteudo],{type:tipo});
 const url=URL.createObjectURL(blob);
 const link=document.createElement('a');link.href=url;link.download=nome;
 document.body.appendChild(link);link.click();link.remove();
 setTimeout(()=>URL.revokeObjectURL(url),3000);
}
function backupDados(){
 const dados={versao:1,exportadoEm:new Date().toISOString(),perfil:authUser,dados:S};
 baixarArquivo('backup-meu-controle-'+authUser+'.json',JSON.stringify(dados,null,2),'application/json');
}
function exp(){
 const rows=[['Tipo','Descrição','Valor','Data','Categoria/Detalhe']];
 S.rec.forEach(i=>rows.push(['Ganho',i.desc,i.valor,D(i.data),i.cat]));
 S.fix.forEach(i=>rows.push(['Gasto fixo',i.desc,i.valor,D(i.data),i.cat]));
 S.var.forEach(i=>rows.push(['Gasto variável',i.desc,i.valor,D(i.data),i.cat]));
 S.cmp.forEach(i=>rows.push(['Compra no cartão',i.desc,i.valor,D(i.data),i.parc+'x']));
 S.div.forEach(i=>rows.push(['Dívida',i.nome,i.parcela,D(i.data),i.pagas+'/'+i.total+' pagas']));
 S.res.forEach(i=>rows.push(['Reserva',i.nome,i.atual,'','meta '+i.meta]));
 const cell=v=>{let t=String(v??'');if(/^[\s]*[=+@-]/.test(t))t="'"+t;return '"'+t.replace(/"/g,'""')+'"'};
 const csv='\ufeff'+rows.map(r=>r.map(cell).join(';')).join('\n');
 baixarArquivo('meu-controle-financeiro.csv',csv,'text/csv;charset=utf-8');
}
