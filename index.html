<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">

<title>Meu Controle Financeiro</title>
<style>

main{flex:1;min-width:0;padding:16px 16px 90px;max-width:1000px;margin:0 auto}
header{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
header h2{margin:0;flex:1;font-size:20px}
input,select{font:inherit;padding:9px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);width:100%}
header input,header select{width:auto}
.btn{background:var(--g);color:#fff;border:0;padding:9px 14px;border-radius:10px;cursor:pointer;font:inherit;font-weight:600}
.btn.s{background:var(--card);color:var(--tx);border:1px solid var(--bd);font-weight:400;padding:6px 10px;font-size:13px}
.btn.d{background:var(--rs);color:var(--r);border:0;padding:6px 10px;font-size:13px;font-weight:400}

.tip{background:var(--bs);color:var(--tx);border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:14px}

.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
h3{margin:0 0 8px;font-size:15px}.ex{color:var(--mu);font-size:13px;margin:0 0 8px}
#m{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:14px;z-index:30}

.ben-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}

.goal-history summary{cursor:pointer;font-size:13px;color:var(--mu)}
.goal-empty{text-align:center;padding:20px 8px}
/* Contas bancárias e conciliação sem duplicação de receitas/despesas */
.bank-top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
.bank-actions{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}

.bank-amount{font-size:22px;font-weight:750;margin:4px 0}
.bank-split{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.bank-split>div{padding:12px;border:1px solid var(--bd);border-radius:12px}
.bank-filter{max-width:340px;margin:10px 0}

.bank-movement{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid var(--bd)}
.bank-movement:last-child{border:0}
.bank-movement .info{flex:1;min-width:160px}
.bank-movement small{display:block;color:var(--mu)}
/* Orientações de fechamento do mês e sugestões para metas */
.advice-panel{border-top:3px solid var(--g)}
.advice-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}
.advice-head h3{font-size:17px;margin:0 0 5px}
.advice-settings{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;align-items:end;margin:12px 0}
.advice-settings label{margin:0}
.advice-settings label span{display:block;margin-bottom:5px}
.advice-settings button{height:40px}
.advice-summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin:12px 0}
.advice-summary>div{border:1px solid var(--bd);border-radius:12px;padding:10px}
.advice-amount{font-size:24px;font-weight:750;margin:4px 0}
.advice-list{list-style:none;margin:6px 0;padding:0}
.advice-list li{border-bottom:1px solid var(--bd);padding:10px 0;display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.advice-list li:last-child{border-bottom:0}
.advice-list li>span{flex:1;min-width:180px}
.advice-note{font-size:13px;color:var(--mu);margin:10px 0}
.advice-reason{font-size:12px;color:var(--mu);margin-top:3px}
.advice-hint{background:var(--ys);border-radius:10px;padding:10px 12px;margin:10px 0;font-size:13px}
@media(max-width:760px){aside{display:none}nav.bt{display:flex}.bl{grid-template-columns:90px 1fr 80px}.ben-actions .btn{flex:1}}
</style></head><body>
<aside><h1>💚 Meu Controle Financeiro</h1><div id="sn"></div></aside>
<main><header><h2 id="ti"></h2><input type="month" id="ym"><button class="btn" onclick="addAny()">+ Adicionar</button></header><div id="v"></div></main>
<nav class="bt" id="bn"></nav><div id="m"><div id="mb"></div></div>
<script>
const KEY="mcf_v1";
const def=()=>({rec:[],fix:[],var:[],car:[],cmp:[],div:[],res:[],ben:[],metas:[],contas:[],transf:[]});
let S;try{S=Object.assign(def(),JSON.parse(localStorage.getItem(KEY))||{})}catch(e){S=def()}
if(!Array.isArray(S.ben))S.ben=[]; // Preserva os dados antigos ao acrescentar benefícios
if(!Array.isArray(S.metas))S.metas=[]; // Metas são opcionais, não migram nem alteram dados anteriores
if(!Array.isArray(S.contas))S.contas=[];
if(!Array.isArray(S.transf))S.transf=[];
// Parâmetros opcionais, sem migrar ou sobrescrever registros financeiros existentes.
if(!S.orient||typeof S.orient!=="object")S.orient={margem:200,percentual:50};
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const now=new Date(),loc=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");
let ym=loc(now),tab="dash";const today=loc(now)+"-"+String(now.getDate()).padStart(2,"0");
const $=s=>document.querySelector(s),R=v=>(+v||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"}),D=d=>d?d.split("-").reverse().join("/"):"",uid=()=>Math.random().toString(36).slice(2,9);
const E=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const mi=y=>+y.slice(0,4)*12+ +y.slice(5,7)-1,fm=n=>Math.floor(n/12)+"-"+String(n%12+1).padStart(2,"0");
const MN=["Jan","Fev","Mar","Abr","Mai","Jun","Jul","Ago","Set","Out","Nov","Dez"];
const sum=a=>a.reduce((s,x)=>s+(+x.valor||0),0);
const CR=["Salário","Comissão","Hora extra","Benefício","Renda extra","Outras receitas"],CV=["Mercado","Alimentação","Transporte","Combustível","Farmácia","Lazer","Compras","Delivery","Outros"],CF=["Aluguel","Condomínio","Água","Energia","Internet","Telefone","Assinatura","Mensalidade","Seguro","Outra fixa"];
const NAV=[["dash","📊","Início"],["rec","💰","Receitas"],["contas","🏦","Contas bancárias"],["ben","🍽️","Benefícios VA/VR"],["fix","🏠","Gastos fixos"],["var","🛒","Gastos variáveis"],["car","💳","Cartões"],["div","📉","Dívidas"],["pag","🗓️","Contas a pagar"],["res","🐷","Reserva"],["metas","🎯","Metas e conquistas"],["rel","📈","Relatórios"]];
const T={rec:"Salários e receitas",contas:"Contas bancárias",ben:"Benefícios: VA e VR",fix:"Gastos fixos",var:"Gastos variáveis",car:"Cartões de crédito",div:"Minhas dívidas",pag:"Contas a pagar",res:"Reserva financeira",metas:"Metas e conquistas",rel:"Relatórios",dash:"Visão geral"};
const FR=[["unica","Única"],["mensal","Mensal"]];
const F={
ben:{t:"Movimentação VA/VR",f:[["tipo","Benefício","select",[["VA","Vale-alimentação (VA)"],["VR","Vale-refeição (VR)"]]],["mov","Tipo de movimentação","select",[["recarga","Recarga / crédito"],["gasto","Gasto / compra"],["inicial","Informar saldo inicial"],["ajuste_mais","Correção positiva de saldo"],["ajuste_menos","Correção negativa de saldo"]]],["desc","Descrição (opcional)","text","Ex.: Recarga da empresa ou mercado"],["valor","Valor (R$)","number","Ex.: 250,00"],["data","Data da movimentação","date"]]},
rec:{t:"Receita",f:[["desc","Descrição","text","Ex.: Salário da empresa"],["valor","Valor (R$)","number","Informe aqui o valor que você recebe"],["data","Data de recebimento","date"],["conta","Conta padrão para recebimento","bankOptional"],["cat","Categoria","select",CR],["freq","Recorrência","select",FR],["st","Situação","select",[["0","Previsto"],["1","Recebido"]]]]},
fix:{t:"Gasto fixo",f:[["desc","Descrição","text","Ex.: Aluguel"],["valor","Valor (R$)","number"],["data","Primeiro vencimento","date"],["freq","Frequência","select",[["mensal","Mensal"],["anual","Anual"],["unica","Única"]]],["cat","Tipo","select",CF],["conta","Conta para pagamento com saldo","bankOptional"],["fonte","Pagamento com","select",[["renda","Saldo / renda disponível"],["cartao","Cartão de crédito"]]],["cid","Selecione o cartão","cardOptional"],["st","Situação (somente saldo / renda)","select",[["0","Pendente"],["1","Pago"]]]]},
var:{t:"Gasto variável",f:[["desc","Descrição","text","Ex.: Compras do mês"],["valor","Valor (R$)","number"],["data","Data","date"],["cat","Categoria","select",CV],["conta","Conta que será debitada","bankOptional"],["fonte","Pagamento com","select",[["renda","Saldo / renda disponível"],["cartao","Cartão de crédito"]]],["cid","Selecione o cartão","cardOptional"],["parc","Parcelas no cartão","number","1 para compra à vista no crédito"]]},
car:{t:"Cartão",f:[["nome","Nome do cartão","text","Ex.: Nubank"],["banco","Banco ou instituição","text"],["limite","Limite total (R$)","number"],["fech","Dia de fechamento","number","Dia em que a fatura fecha (1 a 28)"],["venc","Dia de vencimento","number","Dia em que você paga a fatura"]]},
cmp:{t:"Compra no cartão",f:[["cid","Cartão","card"],["desc","Descrição","text","Ex.: Geladeira"],["valor","Valor total (R$)","number"],["parc","Nº de parcelas","number","1 se for à vista"],["data","Data da compra","date"]]},
div:{t:"Dívida",f:[["nome","Nome da dívida","text","Ex.: Financiamento do carro"],["inst","Instituição","text"],["orig","Valor original (R$)","number"],["parcela","Valor da parcela (R$)","number"],["total","Total de parcelas","number"],["pagas","Parcelas já pagas","number","Use 0 se ainda não pagou nenhuma"],["juros","Juros ao mês (%)","number","Opcional"],["data","Primeiro vencimento","date"]]},
res:{t:"Reserva",f:[["nome","Nome da reserva","text","Ex.: Reserva de emergência"],["obj","Objetivo","text","Ex.: 6 meses de despesas"],["meta","Valor desejado (R$)","number"],["atual","Valor atual (R$)","number"],["contrib","Contribuição mensal (R$)","number"]]},
metas:{t:"Meta ou futura conquista",f:[["nome","Qual é a sua meta?","text","Ex.: Comprar um notebook, fazer uma viagem"],["cat","Categoria","select",["Casa","Viagem","Estudos","Eletrônicos","Veículo","Negócio","Pessoal","Outros"]],["meta","Quanto custa? (R$) — opcional","number","0 se não envolver dinheiro"],["atual","Quanto já separou? (R$)","number","Pode começar com 0"],["prazo","Prazo desejado (opcional)","date"],["prioridade","Prioridade","select",[["media","Média"],["alta","Alta"],["baixa","Baixa"]]],["status","Situação","select",[["planejada","Planejada"],["andamento","Em andamento"],["conquistada","Conquistada"]]],["obs","Observações (opcional)","text","Ex.: Modelo, motivo, próximos passos"]]}};
// ---- cálculos
// Benefícios são saldos próprios e não afetam receitas, gastos ou saldo bancário.
const benCredit=x=>["recarga","inicial","ajuste_mais"].includes(x.mov);
const benSigned=x=>(benCredit(x)?1:-1)*(+x.valor||0);
const benBalance=(tipo,y)=>S.ben.filter(x=>x.tipo===tipo&&x.data&&x.data.slice(0,7)<=y).reduce((acc,x)=>acc+benSigned(x),0);
const benName={recarga:"Recarga",gasto:"Gasto",inicial:"Saldo inicial",ajuste_mais:"Correção (+)",ajuste_menos:"Correção (−)"};
const benDate=()=>ym===today.slice(0,7)?today:ym+"-"+String(Math.min(+today.slice(8,10),new Date(+ym.slice(0,4),+ym.slice(5),0).getDate())).padStart(2,"0");
function openBen(tipo,mov){add("ben",{tipo,mov,data:benDate()})}
function ap(it,y){if(it.skip&&it.skip[y])return false;const s=it.data.slice(0,7),f=it.freq||"unica";if(f==="mensal")return mi(y)>=mi(s);if(f==="anual")return mi(y)>=mi(s)&&(mi(y)-mi(s))%12==0;return y===s}
const dd=(it,y)=>y+"-"+String(Math.min(+it.data.slice(8,10)||1,28)).padStart(2,"0");
// Todos os lançamentos em cartão usam a mesma fatura, sem criar uma segunda despesa.
const inicioFatura=(data,c)=>mi(data.slice(0,7))+(+data.slice(8,10)>+c.fech?1:0)+(+c.venc<=+c.fech?1:0);
function fat(c,limiteFixos){
 const m={},add=(mes,valor)=>{m[mes]=(m[mes]||0)+(+valor||0)};
 [...S.cmp.filter(p=>p.cid===c.id),...S.var.filter(p=>p.fonte==="cartao"&&p.cid===c.id)].forEach(p=>{
  if(!p.data)return;
  const n=Math.max(1,Math.floor(+p.parc||1)),cl=inicioFatura(p.data,c);
  for(let k=0;k<n;k++)add(cl+k,(+p.valor||0)/n);
 });
 // Gasto fixo no cartão: cada mês aplicável gera um lançamento na fatura.
 // O limite é finito para não comprometer artificialmente vários anos de limite do cartão.
 const fim=limiteFixos??Math.max(mi(ym),mi(today.slice(0,7)));
 S.fix.filter(p=>p.fonte==="cartao"&&p.cid===c.id&&p.data).forEach(p=>{
  for(let y=mi(p.data.slice(0,7));y<=fim;y++){
   const mes=fm(y);if(ap(p,mes))add(inicioFatura(dd(p,mes),c),p.valor);
  }
 });
 return m;
}
const rest=d=>Math.max(0,(+d.total-+d.pagas)*+d.parcela);
function bills(y){const o=[];
S.fix.filter(i=>i.fonte!=="cartao"&&ap(i,y)).forEach(i=>o.push({k:"fix",id:i.id,desc:i.desc,valor:+i.valor,due:dd(i,y),paid:!!(i.pm&&i.pm[y]),cat:"Contas fixas"}));
S.car.forEach(c=>{const v=fat(c,mi(y))[mi(y)];if(v>0)o.push({k:"fat",id:c.id,desc:"Fatura "+c.nome,valor:v,due:y+"-"+String(c.venc).padStart(2,"0"),paid:!!(c.pm&&c.pm[y]),cat:"Cartões"})});
S.div.forEach(d=>{const p=d.pm&&d.pm[y];if(p||(+d.pagas<+d.total&&mi(y)>=mi(d.data.slice(0,7))))o.push({k:"div",id:d.id,desc:d.nome+" (parcela)",valor:+d.parcela,due:dd(d,y),paid:!!p,cat:"Dívidas"})});return o}
const recs=y=>S.rec.filter(i=>ap(i,y)).map(i=>({...i,paid:!!(i.pm&&i.pm[y])}));
function tot(y){const r=recs(y),b=bills(y),v=S.var.filter(i=>i.data.slice(0,7)===y);
const rr=sum(r.filter(x=>x.paid)),rp=sum(r.filter(x=>!x.paid)),dp=sum(b.filter(x=>x.paid))+sum(v.filter(x=>x.fonte!=="cartao")),dn=sum(b.filter(x=>!x.paid));
return{r,b,v,rr,rp,dp,dn,saldo:rr-dp,livre:rr+rp-dp-dn,bp:sum(b.filter(x=>x.paid)),bn:dn}}
// Fluxo de caixa acumulado: o saldo não zera ao trocar o mês.
// Apenas receitas recebidas e gastos efetivos entram no saldo bancário.
// Recargas e gastos de VA/VR continuam separados deste cálculo.
const pagoAte=(it,y,valor,precisaAplicar=true)=>Object.entries(it.pm||{}).reduce((s,[mes,pago])=>s+(pago&&mes<=y&&(!precisaAplicar||ap(it,mes))?(+valor||0):0),0);
function fluxoAte(y){
 const entradas=S.rec.reduce((s,i)=>s+pagoAte(i,y,i.valor),0);
 const fixas=S.fix.filter(i=>i.fonte!=="cartao").reduce((s,i)=>s+pagoAte(i,y,i.valor),0);
 const variaveis=S.var.filter(i=>i.fonte!=="cartao").reduce((s,i)=>s+(i.data&&i.data.slice(0,7)<=y?(+i.valor||0):0),0);
 const cartoes=S.car.reduce((s,c)=>{const f=fat(c,mi(y));return s+Object.entries(c.pm||{}).reduce((v,[mes,pago])=>v+(pago&&mes<=y?(+f[mi(mes)]||0):0),0)},0);
 const dividas=S.div.reduce((s,d)=>s+pagoAte(d,y,d.parcela,false),0);
 return{entradas,saidas:fixas+variaveis+cartoes+dividas,saldo:entradas-fixas-variaveis-cartoes-dividas};
}
// Um saldo inicial de conta representa somente dinheiro que ainda NÃO constava nos lançamentos.
// Lançamentos antigos sem conta associada continuam em "Sem conta definida".
const BANK_UNLINKED="_sem_conta";
const bankValid=id=>S.contas.some(c=>c.id===id);
const bankId=id=>bankValid(id)?id:BANK_UNLINKED;
const bankName=id=>id===BANK_UNLINKED||!bankValid(id)?"Sem conta definida":S.contas.find(c=>c.id===id).nome;
const bankPaidId=(it,mes)=>bankId(it.pmConta?.[mes]||"");
const bankOpening=y=>S.contas.reduce((sum,c)=>sum+(c.dataInicial&&c.dataInicial.slice(0,7)<=y?(+c.inicial||0):0),0);
const saldoAte=y=>fluxoAte(y).saldo+bankOpening(y);
// Calcula o saldo de cada banco a partir das movimentações já existentes.
// Transferências trocam o dinheiro de lugar, mas nunca mudam o saldo total.
function bankBalances(y){
 const saldos=Object.fromEntries(S.contas.map(c=>[c.id,c.dataInicial?.slice(0,7)<=y?(+c.inicial||0):0]));
 const m=(id,v)=>{id=bankId(id);if(id!==BANK_UNLINKED)saldos[id]=(saldos[id]||0)+v};
 S.rec.forEach(i=>Object.entries(i.pm||{}).forEach(([mes,p])=>{if(p&&mes<=y&&ap(i,mes))m(bankPaidId(i,mes),+i.valor||0)}));
 S.fix.filter(i=>i.fonte!=="cartao").forEach(i=>Object.entries(i.pm||{}).forEach(([mes,p])=>{if(p&&mes<=y&&ap(i,mes))m(bankPaidId(i,mes),-(+i.valor||0))}));
 S.var.filter(i=>i.fonte!=="cartao").forEach(i=>{if(i.data&&i.data.slice(0,7)<=y)m(i.conta,-(+i.valor||0))});
 S.car.forEach(c=>{const fatMes=fat(c,mi(y));Object.entries(c.pm||{}).forEach(([mes,p])=>{if(p&&mes<=y)m(bankPaidId(c,mes),-(+fatMes[mi(mes)]||0))})});
 S.div.forEach(d=>Object.entries(d.pm||{}).forEach(([mes,p])=>{if(p&&mes<=y)m(bankPaidId(d,mes),-(+d.parcela||0))}));
 S.transf.forEach(t=>{if(t.data&&t.data.slice(0,7)<=y){m(t.origem,-(+t.valor||0));m(t.destino,+t.valor||0)}});
 const vinculado=Object.values(saldos).reduce((a,v)=>a+v,0);
 return {saldos,semConta:saldoAte(y)-vinculado,total:saldoAte(y)};
}

function applyPayment(k,id,newPaid,conta){
 const it={fix:S.fix,fat:S.car,rec:S.rec,div:S.div}[k]?.find(x=>x.id===id);
 if(!it)return;
 it.pm=it.pm||{};const estava=!!it.pm[ym];it.pm[ym]=newPaid;
 it.pmConta=it.pmConta||{};
 if(newPaid)it.pmConta[ym]=bankId(conta)===BANK_UNLINKED?"":conta;
 else delete it.pmConta[ym];
 if(k==="div"&&estava!==newPaid)it.pagas=Math.max(0,+it.pagas+(newPaid?1:-1));
 save();go();
}

function bankLedger(y){

 };

 recs(y).filter(i=>i.paid).forEach(i=>push(dd(i,y),"Receita: "+i.desc,+i.valor,bankPaidId(i,y),"rec"));
 S.fix.filter(i=>i.fonte!=="cartao"&&ap(i,y)&&i.pm?.[y]).forEach(i=>push(dd(i,y),"Gasto fixo: "+i.desc,-(+i.valor),bankPaidId(i,y),"fix"));

 S.car.forEach(c=>{const val=fat(c,mi(y))[mi(y)]||0;if(c.pm?.[y]&&val)push(y+"-"+String(c.venc).padStart(2,"0"),"Fatura: "+c.nome,-val,bankPaidId(c,y),"fat")});
 S.div.filter(d=>d.pm?.[y]).forEach(d=>push(dd(d,y),"Parcela: "+d.nome,-(+d.parcela),bankPaidId(d,y),"div"));
 S.transf.filter(t=>t.data?.slice(0,7)===y).forEach(t=>{
  push(t.data,"Transferência para "+bankName(t.destino),-t.valor,t.origem,"transferencia",t.id);

 });
 return ev.sort((a,b)=>b.data.localeCompare(a.data)||b.valor-a.valor);

// Metas são um planejamento separado do caixa e da reserva.
// Guardar uma contribuição aqui apenas acompanha o objetivo: não cria receita nem despesa.
const prioLabel={alta:"Alta",media:"Média",baixa:"Baixa"};
const metaLabel={planejada:"Planejada",andamento:"Em andamento",conquistada:"Conquistada"};
const goalActive=m=>m.status!=="conquistada";
const goalRemain=m=>Math.max(0,(+m.meta||0)-(+m.atual||0));
function prazoMeta(m){
 if(!m.prazo||m.status==="conquistada")return "";
 const dias=Math.round((Date.parse(m.prazo+"T12:00:00")-Date.parse(today+"T12:00:00"))/86400000);
 if(!Number.isFinite(dias))return "";
 return dias<0?"Prazo ultrapassado há "+Math.abs(dias)+" dia(s)":dias===0?"Prazo: hoje":"Faltam "+dias+" dia(s)";
}
function valorMensalMeta(m){
 if(!m.prazo||+m.meta<=0||goalRemain(m)<=0||m.status==="conquistada"||m.prazo<today)return "";
 const meses=Math.max(1,Math.ceil((Date.parse(m.prazo+"T12:00:00")-Date.parse(today+"T12:00:00"))/(86400000*30.4375)));
 return R(goalRemain(m)/meses)+" por mês até o prazo (estimativa)";
}

// ---- Sugestões financeiras baseadas nos lançamentos (sem IA externa ou movimentação automática).
const cents=v=>Math.max(0,Math.round((Number(v)||0)*100));
const fromCents=n=>n/100;
const advicePriority=b=>{
 const fix=b.k==="fix"?S.fix.find(x=>x.id===b.id):null;
 const essential=fix&&["Aluguel","Condomínio","Água","Energia","Internet","Telefone","Seguro"].includes(fix.cat);
 return b.k==="fat"?"Fatura de cartão":b.k==="div"?"Parcela de dívida":essential?"Despesa essencial":"Outra conta";
};
// Inclui contas antigas ainda não pagas, evitando recomendar valores já comprometidos.
function adviceOldBills(y){
 const dates=[...S.fix,...S.cmp,...S.var.filter(i=>i.fonte==="cartao"),...S.div].map(x=>x.data).filter(d=>/^\d{4}-\d{2}-\d{2}$/.test(d||""));
 if(!dates.length)return {items:[],limitado:false};
 const inicio=Math.min(...dates.map(d=>mi(d.slice(0,7)))),fim=mi(y),min=Math.max(inicio,fim-119),items=[];
 for(let m=min;m<fim;m++)items.push(...bills(fm(m)).filter(x=>!x.paid));
 return {items,limitado:inicio<min};
}
function adviceGoals(y,valor){
 const items=S.metas.filter(m=>goalActive(m)&&goalRemain(m)>0&&+m.meta>0)
  .map(m=>({m,limite:cents(goalRemain(m)),receber:0,peso:(m.prioridade==="alta"?3:m.prioridade==="baixa"?1:2)*(!m.prazo?1:(mi(m.prazo.slice(0,7))-mi(y)<=3?2:1.4))}));
 let sobrou=Math.min(cents(valor),items.reduce((t,it)=>t+it.limite,0));
 // Divisão ponderada por prioridade e prazo; redistribui sobras de metas já atingidas.
 for(let rod=0;rod<items.length+2&&sobrou>0;rod++){
  const validos=items.filter(it=>it.limite>it.receber);
  if(!validos.length)break;
  const total=validos.reduce((t,it)=>t+it.peso,0);let distribuido=0;
  for(let n=0;n<validos.length;n++){
   const it=validos[n],disponivel=it.limite-it.receber;
   const cuota=n===validos.length-1?sobrou-distribuido:Math.floor(sobrou*it.peso/total);
   const dar=Math.min(disponivel,Math.max(0,cuota));it.receber+=dar;distribuido+=dar;
  }
  if(distribuido===0){validos[0].receber++;distribuido=1;}
  sobrou-=distribuido;
 }
 return items.filter(it=>it.receber>0).sort((a,b)=>b.peso-a.peso).map(it=>({meta:it.m,valor:fromCents(it.receber)}));
}
function adviceCalc(y){
 const t=tot(y),antigas=adviceOldBills(y),pendentes=[...antigas.items,...t.b.filter(x=>!x.paid)];
 const restante=pendentes.reduce((a,x)=>a+(+x.valor||0),0);
 const metasSeparadas=S.metas.filter(goalActive).reduce((a,m)=>a+(+m.atual||0),0);
 const reservas=S.res.reduce((a,r)=>a+(+r.atual||0),0);
 const jaSeparado=metasSeparadas+reservas;
 const saldo=saldoAte(y),margem=Math.max(0,Number(S.orient.margem)||0);
 const percentual=Math.max(0,Math.min(100,Number(S.orient.percentual)||0));
 const base=Math.max(0,saldo-restante-jaSeparado-margem);
 const recomendacao=fromCents(Math.min(cents(base*percentual/100),S.metas.filter(goalActive).reduce((a,m)=>a+cents(goalRemain(m)),0)));
 const recomendado=adviceGoals(y,recomendacao);
 const futuros=+t.rp||0;
 const projecao=saldo+futuros-restante-jaSeparado-margem;
 const contas=[...pendentes].sort((a,b)=>{
