<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meu Controle Financeiro</title>
<style>
:root{--bg:#f5f7f6;--card:#fff;--tx:#1f2937;--mu:#6b7280;--bd:#e5e7eb;--g:#16a34a;--r:#dc2626;--y:#d97706;--b:#2563eb;--gs:#dcfce7;--rs:#fee2e2;--ys:#fef3c7;--bs:#dbeafe;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111827;--card:#1f2937;--tx:#f3f4f6;--mu:#9ca3af;--bd:#374151;--gs:#14532d;--rs:#7f1d1d;--ys:#78350f;--bs:#1e3a8a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111827;--card:#1f2937;--tx:#f3f4f6;--mu:#9ca3af;--bd:#374151;--gs:#14532d;--rs:#7f1d1d;--ys:#78350f;--bs:#1e3a8a;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;display:flex;min-height:100vh}
aside{width:200px;background:var(--card);border-right:1px solid var(--bd);padding:16px 10px;position:sticky;top:0;height:100vh;flex:none}
aside h1{font-size:16px;color:var(--g);margin:0 8px 14px}
.nb{display:flex;gap:8px;align-items:center;width:100%;border:0;background:none;color:var(--tx);padding:9px 10px;border-radius:10px;cursor:pointer;font:inherit;text-align:left}
.nb.on{background:var(--gs);color:var(--g);font-weight:600}
main{flex:1;min-width:0;padding:16px 16px 90px;max-width:1000px;margin:0 auto}
header{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
header h2{margin:0;flex:1;font-size:20px}
input,select{font:inherit;padding:9px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);width:100%}
header input,header select{width:auto}
.btn{background:var(--g);color:#fff;border:0;padding:9px 14px;border-radius:10px;cursor:pointer;font:inherit;font-weight:600}
.btn.s{background:var(--card);color:var(--tx);border:1px solid var(--bd);font-weight:400;padding:6px 10px;font-size:13px}
.btn.d{background:var(--rs);color:var(--r);border:0;padding:6px 10px;font-size:13px;font-weight:400}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.grid .card{margin:0}.k{font-size:12px;color:var(--mu)}.v{font-size:20px;font-weight:700;margin-top:2px}
.g{color:var(--g)}.r{color:var(--r)}.y{color:var(--y)}.b{color:var(--b)}
.tip{background:var(--bs);color:var(--tx);border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:14px}
.row{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--bd);flex-wrap:wrap}
.row:last-child{border:0}.row .i{flex:1;min-width:140px}.row small{color:var(--mu);display:block}
.tag{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--gs);color:var(--g)}
.tag.p{background:var(--ys);color:var(--y)}.tag.v{background:var(--rs);color:var(--r)}
.bar{height:10px;background:var(--bd);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;border-radius:99px}
.bl{display:grid;grid-template-columns:110px 1fr 90px;gap:8px;align-items:center;margin:7px 0;font-size:13px}
.bl span:last-child{text-align:right}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
h3{margin:0 0 8px;font-size:15px}.ex{color:var(--mu);font-size:13px;margin:0 0 8px}
#m{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:14px;z-index:30}
#m>div{background:var(--card);border-radius:16px;padding:18px;width:100%;max-width:420px;max-height:90vh;overflow:auto}
label{display:block;font-size:13px;margin:10px 0 3px;font-weight:600}label small{font-weight:400;color:var(--mu)}
nav.bt{display:none;position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);overflow-x:auto;padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px));z-index:20}
nav.bt button{flex:none;border:0;background:none;color:var(--mu);font-size:11px;padding:4px 10px;display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer}
nav.bt button.on{color:var(--g);font-weight:700}
/* Escolha do modo de cadastro apenas na aba Receitas */
.rec-options{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:12px}
.rec-options .btn{flex:1;min-width:145px;min-height:42px}
.rec-options .selected{box-shadow:inset 0 0 0 2px var(--g);font-weight:700}
.rec-field{margin:8px 0 12px}
.rec-field label{margin:0 0 4px}
.rec-hint{color:var(--mu);font-size:13px;margin:8px 0}
.rec-status{font-size:13px;border-radius:10px;padding:10px;margin:10px 0;background:var(--bs)}
.bank-mini{display:flex;justify-content:space-between;gap:10px;align-items:center;border-bottom:1px solid var(--bd);padding:10px 0;font-size:14px}
.bank-mini:last-of-type{border-bottom:0}
@media(max-width:760px){aside{display:none}nav.bt{display:flex}.bl{grid-template-columns:90px 1fr 80px}}

</style></head><body>
<aside><h1>💚 Meu Controle Financeiro</h1><div id="sn"></div></aside>
<main><header><h2 id="ti"></h2><input type="month" id="ym"><button class="btn" onclick="addAny()">+ Adicionar</button></header><div id="v"></div></main>
<nav class="bt" id="bn"></nav><div id="m"><div id="mb"></div></div>
<script>
const KEY="mcf_v1";
const def=()=>({rec:[],fix:[],var:[],car:[],cmp:[],div:[],res:[]});
let S;try{S=Object.assign(def(),JSON.parse(localStorage.getItem(KEY))||{})}catch(e){S=def()}
if(!Array.isArray(S.pluggyIgnorados))S.pluggyIgnorados=[];
if(!Array.isArray(S.pluggyVinculos))S.pluggyVinculos=[];
if(!Array.isArray(S.pluggySaldos))S.pluggySaldos=[];
if(!Array.isArray(S.pluggyNeutros))S.pluggyNeutros=[]; // Transações especiais sem impacto duplicado.
if(!Array.isArray(S.pluggyAvisos))S.pluggyAvisos=[];
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const now=new Date(),loc=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");
let ym=loc(now),tab="dash";const today=loc(now)+"-"+String(now.getDate()).padStart(2,"0");
const $=s=>document.querySelector(s),R=v=>(+v||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"}),D=d=>d?d.split("-").reverse().join("/"):"",uid=()=>Math.random().toString(36).slice(2,9);
const E=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const mi=y=>+y.slice(0,4)*12+ +y.slice(5,7)-1,fm=n=>Math.floor(n/12)+"-"+String(n%12+1).padStart(2,"0");
const MN=["Jan","Fev","Mar","Abr","Mai","Jun","Jul","Ago","Set","Out","Nov","Dez"];
const sum=a=>a.reduce((s,x)=>s+(+x.valor||0),0);
const CR=["Salário","Comissão","Hora extra","Benefício","Renda extra","Outras receitas"],CV=["Mercado","Alimentação","Transporte","Combustível","Farmácia","Lazer","Compras","Delivery","Outros"],CF=["Aluguel","Condomínio","Água","Energia","Internet","Telefone","Assinatura","Mensalidade","Seguro","Outra fixa"];
const NAV=[["dash","📊","Início"],["rec","💰","Receitas"],["fix","🏠","Gastos fixos"],["var","🛒","Gastos variáveis"],["car","💳","Cartões"],["div","📉","Dívidas"],["pag","🗓️","Contas a pagar"],["res","🐷","Reserva"],["rel","📈","Relatórios"]];
const T={rec:"Salários e receitas",fix:"Gastos fixos",var:"Gastos variáveis",car:"Cartões de crédito",div:"Minhas dívidas",pag:"Contas a pagar",res:"Reserva financeira",rel:"Relatórios",dash:"Visão geral"};
const FR=[["unica","Única"],["mensal","Mensal"]];
const F={
rec:{t:"Receita",f:[["desc","Descrição","text","Ex.: Salário da empresa"],["valor","Valor (R$)","number","Informe aqui o valor que você recebe"],["data","Data de recebimento","date"],["cat","Categoria","select",CR],["freq","Recorrência","select",FR],["st","Situação","select",[["0","Previsto"],["1","Recebido"]]]]},
fix:{t:"Gasto fixo",f:[["desc","Descrição","text","Ex.: Aluguel"],["valor","Valor (R$)","number"],["data","Primeiro vencimento","date"],["freq","Frequência","select",[["mensal","Mensal"],["anual","Anual"],["unica","Única"]]],["cat","Tipo","select",CF],["st","Situação","select",[["0","Pendente"],["1","Pago"]]]]},
var:{t:"Gasto variável",f:[["desc","Descrição","text","Ex.: Compras do mês"],["valor","Valor (R$)","number"],["data","Data","date"],["cat","Categoria","select",CV]]},
car:{t:"Cartão",f:[["nome","Nome do cartão","text","Ex.: Nubank"],["banco","Banco ou instituição","text"],["limite","Limite total (R$)","number"],["fech","Dia de fechamento","number","Dia em que a fatura fecha (1 a 28)"],["venc","Dia de vencimento","number","Dia em que você paga a fatura"]]},
cmp:{t:"Compra no cartão",f:[["cid","Cartão","card"],["desc","Descrição","text","Ex.: Geladeira"],["valor","Valor total (R$)","number"],["parc","Nº de parcelas","number","1 se for à vista"],["data","Data da compra","date"]]},
div:{t:"Dívida",f:[["nome","Nome da dívida","text","Ex.: Financiamento do carro"],["inst","Instituição","text"],["orig","Valor original (R$)","number"],["parcela","Valor da parcela (R$)","number"],["total","Total de parcelas","number"],["pagas","Parcelas já pagas","number","Use 0 se ainda não pagou nenhuma"],["juros","Juros ao mês (%)","number","Opcional"],["data","Primeiro vencimento","date"]]},
res:{t:"Reserva",f:[["nome","Nome da reserva","text","Ex.: Reserva de emergência"],["obj","Objetivo","text","Ex.: 6 meses de despesas"],["meta","Valor desejado (R$)","number"],["atual","Valor atual (R$)","number"],["contrib","Contribuição mensal (R$)","number"]]}};
// ---- cálculos
function ap(it,y){if(it.skip&&it.skip[y])return false;const s=it.data.slice(0,7),f=it.freq||"unica";if(f==="mensal")return mi(y)>=mi(s);if(f==="anual")return mi(y)>=mi(s)&&(mi(y)-mi(s))%12==0;return y===s}
const dd=(it,y)=>y+"-"+String(Math.min(+it.data.slice(8,10)||1,28)).padStart(2,"0");
function fat(c){const m={};S.cmp.filter(p=>p.cid===c.id).forEach(p=>{const n=Math.max(1,+p.parc||1),d=+p.data.slice(8,10),cl=mi(p.data.slice(0,7))+(d>c.fech?1:0)+(c.venc<=c.fech?1:0);for(let k=0;k<n;k++)m[cl+k]=(m[cl+k]||0)+p.valor/n});return m}
const rest=d=>Math.max(0,(+d.total-+d.pagas)*+d.parcela);
function bills(y){const o=[];
S.fix.filter(i=>ap(i,y)).forEach(i=>o.push({k:"fix",id:i.id,desc:i.desc,valor:+i.valor,due:dd(i,y),paid:!!(i.pm&&i.pm[y]),cat:"Contas fixas"}));
S.car.forEach(c=>{const v=fat(c)[mi(y)];if(v>0)o.push({k:"fat",id:c.id,desc:"Fatura "+c.nome,valor:v,due:y+"-"+String(c.venc).padStart(2,"0"),paid:!!(c.pm&&c.pm[y]),cat:"Cartões"})});
S.div.forEach(d=>{const p=d.pm&&d.pm[y];if(p||(+d.pagas<+d.total&&mi(y)>=mi(d.data.slice(0,7))))o.push({k:"div",id:d.id,desc:d.nome+" (parcela)",valor:+d.parcela,due:dd(d,y),paid:!!p,cat:"Dívidas"})});return o}
const recs=y=>S.rec.filter(i=>ap(i,y)).map(i=>({...i,paid:!!(i.pm&&i.pm[y])}));
function tot(y){const r=recs(y),b=bills(y),v=S.var.filter(i=>i.data.slice(0,7)===y);
const rr=sum(r.filter(x=>x.paid)),rp=sum(r.filter(x=>!x.paid)),dp=sum(b.filter(x=>x.paid))+sum(v),dn=sum(b.filter(x=>!x.paid));
return{r,b,v,rr,rp,dp,dn,saldo:rr-dp,livre:rr+rp-dp-dn,bp:sum(b.filter(x=>x.paid)),bn:dn}}
function tg(k,id){const y=ym,L={fix:S.fix,fat:S.car,rec:S.rec,div:S.div}[k],it=L.find(x=>x.id===id);if(it.pluggyRef)return;it.pm=it.pm||{};const on=!it.pm[y];it.pm[y]=on;if(k==="div")it.pagas=Math.max(0,+it.pagas+(on?1:-1));save();go()}
// ---- UI
const bar=(l,v,max,c,txt)=>`<div class="bl"><span>${E(l)}</span><div class="bar"><i style="width:${max?Math.min(100,Math.max(0,v/max*100)):0}%;background:var(--${c})"></i></div><span>${txt??R(v)}</span></div>`;
const tip=t=>`<div class="tip">💡 ${t}</div>`;
const row=(t,s,amt,act,tag)=>`<div class="row"><div class="i"><b>${t}</b><small>${s}</small></div>${tag||""}<b>${amt}</b>${act||""}</div>`;
const eb=(k,id)=>`<button class="btn s" onclick="edit('${k}','${id}')">Editar</button> <button class="btn d" onclick="del('${k}','${id}')">Excluir</button>`;
const tgl=(k,id,p,a,b)=>`<button class="btn s" onclick="tg('${k}','${id}')">${p?b:a}</button>`;
function nav(){const h=NAV.map(n=>`<button class="nb ${n[0]===tab?"on":""}" onclick="tab='${n[0]}';go()">${n[1]} ${n[2]}</button>`).join("");$("#sn").innerHTML=h;$("#bn").innerHTML=NAV.map(n=>`<button class="${n[0]===tab?"on":""}" onclick="tab='${n[0]}';go()"><span style="font-size:18px">${n[1]}</span>${n[2].split(" ")[0]}</button>`).join("")}
function go(){nav();$("#ti").textContent=T[tab];$("#ym").value=ym;$("#v").innerHTML=V[tab]();window.scrollTo(0,0)}
const V={
dash(){const t=tot(ym),dv=S.div.reduce((s,d)=>s+rest(d),0),cat={};t.v.forEach(x=>cat[x.cat]=(cat[x.cat]||0)+ +x.valor);t.b.forEach(x=>cat[x.cat]=(cat[x.cat]||0)+x.valor);const cs=Object.entries(cat).sort((a,b)=>b[1]-a[1]),mx=cs[0]?cs[0][1]:0,mxx=Math.max(t.rr+t.rp,t.dp+t.dn,1);
const ev=[5,4,3,2,1,0].map(n=>{const y=fm(mi(ym)-n);return[MN[+y.slice(5)-1],tot(y).saldo]}),em=Math.max(...ev.map(e=>Math.abs(e[1])),1);
const K=(a,b,c,d)=>`<div class="card"><div class="k">${a}</div><div class="v ${c}">${b}</div><div class="k">${d||""}</div></div>`;
return pluggySaldosCard()+tip("Saldo bancário consultado: o valor disponibilizado pela instituição. Receitas e despesas abaixo são movimentos do mês, não devem ser somados novamente ao saldo do banco.")+`<div class="grid">${K("Receitas do mês",R(t.rr+t.rp),"g","Recebido "+R(t.rr)+" · previsto "+R(t.rp))}${K("Gastos do mês",R(t.dp+t.dn),"r","Pago "+R(t.dp)+" · pendente "+R(t.dn))}${K("Dívidas restantes",R(dv),"r")}${K("Contas pendentes",R(t.bn),"y")}${K("Contas pagas",R(t.bp),"g")}${K("Saldo do mês (controle)",R(t.saldo),t.saldo<0?"r":"g","Recebido menos pago no mês")}${K("Sobra estimada do mês",R(t.livre),t.livre<0?"r":"b","Não representa o saldo do banco")}</div>
<div class="two"><div class="card"><h3>Receitas versus despesas</h3>${bar("Receitas",t.rr+t.rp,mxx,"g")}${bar("Despesas",t.dp+t.dn,mxx,"r")}</div>
<div class="card"><h3>Gastos por categoria</h3>${cs.length?cs.map(c=>bar(c[0],c[1],mx,"b")).join(""):'<p class="ex">Nenhum gasto neste mês ainda.</p>'}</div>
<div class="card"><h3>Evolução do saldo (6 meses)</h3>${ev.map(e=>bar(e[0],Math.abs(e[1]),em,e[1]<0?"r":"g",R(e[1]))).join("")}</div>
<div class="card"><h3>Quitação das dívidas</h3>${S.div.length?S.div.map(d=>bar(d.nome,+d.pagas,+d.total,"g",Math.round(d.pagas/d.total*100||0)+"%")).join(""):'<p class="ex">Cadastre uma dívida para acompanhar.</p>'}</div></div>`},
rec(){const r=recs(ym),modo=window.recModo||"manual";
const escolha=`<div class="card"><h3>Como deseja registrar receitas?</h3><div class="rec-options"><button class="btn ${modo==="manual"?"selected":"s"}" onclick="recModo='manual';go()">✍️ Preenchimento manual</button><button class="btn ${modo==="pluggy"?"selected":"s"}" onclick="recModo='pluggy';go()">🔗 Open Finance · Meu Pluggy</button></div>${modo==="manual"?`<p class="ex">Cadastre salário e outras entradas normalmente.</p><button class="btn" onclick="add('rec')">+ Adicionar receita</button>`:pluggyPanel()}</div>`;
return escolha+`<div class="card"><h3>Receitas de ${ym.slice(5)}/${ym.slice(0,4)}</h3>${r.length?r.map(i=>row(E(i.desc),E(i.cat)+" · "+D(dd(i,ym))+" · "+(i.freq==="mensal"?"mensal":"única")+(i.pluggyRef?" · 🔗 Importado":""),R(i.valor),(i.pluggyRef?'':tgl("rec",i.id,i.paid,"Marcar recebido","Desfazer")+" ")+eb("rec",i.id),(i.pluggyRef?'':`<span class="tag ${i.paid?"":"p"}">${i.paid?"Recebido":"Previsto"}</span>`))).join(""):'<p class="ex">Nenhuma receita neste mês.</p>'}</div><div class="grid"><div class="card"><div class="k">Recebido</div><div class="v g">${R(sum(r.filter(x=>x.paid)))}</div></div><div class="card"><div class="k">Previsto</div><div class="v y">${R(sum(r.filter(x=>!x.paid)))}</div></div></div>`},
fix(){const b=S.fix.filter(i=>ap(i,ym));return tip("Cadastre suas contas para saber quanto do seu salário já está comprometido.")+`<div class="card">${b.length?b.map(i=>{const p=!!(i.pm&&i.pm[ym]);return row(E(i.desc),E(i.cat)+" · "+(i.pluggyRef?"Pagamento no banco ":"vence ")+D(dd(i,ym))+" · "+i.freq+(i.pluggyRef?" · 🔗 Importado":""),R(i.valor),(i.pluggyRef?'':tgl("fix",i.id,p,"Marcar paga","Desfazer")+" ")+eb("fix",i.id)+(i.pluggyRef?` <button class="btn s" onclick="pluggyAlterarTipo('fix','${i.id}')">Mover para variáveis</button>`:''),(i.pluggyRef?'':`<span class="tag ${p?"":"p"}">${p?"Paga":"Pendente"}</span>`))}).join(""):'<p class="ex">Nenhum gasto fixo neste mês.</p>'}</div><div class="card"><div class="k">Total de gastos fixos do mês</div><div class="v r">${R(sum(b))}</div></div>`},

function pluggyExistente(ref){
 return S.pluggyIgnorados.includes(ref) || S.pluggyVinculos.includes(ref)
 || S.rec.some(i=>i.pluggyRef===ref) || S.var.some(i=>i.pluggyRef===ref)
 || S.fix.some(i=>i.pluggyRef===ref) || S.pluggyNeutros.some(i=>i.ref===ref);

function pluggyComparar(t,desc,data,valor){
 if(Math.abs(Number(valor)-t.valor)>0.009 || !/^\d{4}-\d{2}-\d{2}$/.test(data||''))return false;
 const dt=new Date(t.data+'T12:00:00'), dr=new Date(data+'T12:00:00');
 if(Math.abs(dt-dr)>3*86400000)return false;
 const a=pluggyNorm(t.desc).replace(/^(?:pix|pagamento|compra)\s+/,'');
 const b=pluggyNorm(desc).replace(/^(?:pix|pagamento|compra)\s+/,'');
 return !!(a.length>=4&&b.length>=4&&(a.includes(b)||b.includes(a)));
}
// Classificação por evidências da descrição. Uma única conta paga NÃO comprova recorrência.
// Por isso, contas fixas bancárias entram como pagamentos únicos; novos meses são importados separadamente.
const PLUGGY_REGRAS_FIXAS=[
 [/\b(aluguel|locacao|condominio|prestacao imovel)\b/,"Aluguel"],
 [/\b(sabesp|conta de agua|saneamento|sanesul|copasa)\b/,"Água"],
 [/\b(enel|cpfl|energisa|equatorial|cemig|conta de luz|energia eletrica)\b/,"Energia"],
 [/\b(vivo fibra|claro net|tim internet|internet fibra|banda larga)\b/,"Internet"],
 [/\b(telefone fixo|conta telefone|plano celular|telefonia)\b/,"Telefone"],
 [/\b(netflix|spotify|disney|hbo|amazon prime|assinatura|mensalidade streaming)\b/,"Assinatura"],
 [/\b(escola|faculdade|curso mensal|mensalidade)\b/,"Mensalidade"],
 [/\b(seguro auto|seguro vida|seguradora)\b/,"Seguro"]
];
function pluggyClassificarFixo(t){
 const n=pluggyNorm(t.desc);
 for(const [regex,cat] of PLUGGY_REGRAS_FIXAS)if(regex.test(n))return cat;
 return null;
}
function pluggyAcumular(t){

 if(t.tipo==='entrada'){
   S.rec.push({id:uid(),desc:t.desc.slice(0,120),valor:t.valor,data:t.data,cat:CR.includes(t.cat)?t.cat:'Outras receitas',freq:'unica',pm:{[mes]:true},pluggyRef:t.ref});

   const fixa=pluggyClassificarFixo(t);
   if(fixa){
     S.fix.push({id:uid(),desc:t.desc.slice(0,120),valor:t.valor,data:t.data,cat:fixa,freq:'unica',pm:{[mes]:true},pluggyRef:t.ref});
   }else{

}

function pluggyMigrarAntigos(){
 if(S.pluggyClassificacaoMigrada)return 0;
 let total=0;
 for(const it of [...S.var]){
   if(!it.pluggyRef||it.cat!=='Outros')continue;
   const cat=pluggyClassificarFixo(it);
   if(!cat)continue;
   S.var=S.var.filter(x=>x.id!==it.id);

}

// Reconciliação conservadora. Só vincula automaticamente quando há UMA correspondência clara.
// Faturas e despesas já cadastradas não são lançadas uma segunda vez.
function pluggyConciliar(t){
 const mes=t.data.slice(0,7);
 if(t.tipo==='entrada'){
   const matches=S.rec.filter(i=>{if(i.pluggyRef)return false;
     if(i.freq==='mensal')return i.data?.slice(0,7)<=mes && i.cat==='Salário' && t.cat==='Salário' && Math.abs(i.valor-t.valor)<.01;
     return pluggyComparar(t,i.desc,i.data,i.valor);
   });
   if(matches.length===1){const i=matches[0];if(i.freq!=='mensal')i.pluggyRef=t.ref;
     i.pm=i.pm||{};i.pm[mes]=true;S.pluggyVinculos.push(t.ref);return 'vinculado';}
   if(matches.length>1)return 'revisar';
   return '';
 }
 const variable=S.var.filter(i=>!i.pluggyRef&&pluggyComparar(t,i.desc,i.data,i.valor));
 if(variable.length===1){variable[0].pluggyRef=t.ref;S.pluggyVinculos.push(t.ref);return 'vinculado';}
 if(variable.length>1)return 'revisar';
 // Buscar só contas fixas semelhantes que já pertencem ao mês.
 const fixed=S.fix.filter(i=>ap(i,mes)&&pluggyComparar(t,i.desc,dd(i,mes),i.valor));
 if(fixed.length===1){fixed[0].pm=fixed[0].pm||{};fixed[0].pm[mes]=true;S.pluggyVinculos.push(t.ref);return 'vinculado';}
 if(fixed.length>1)return 'revisar';
 // Pagamento de fatura: a despesa é a fatura, não uma nova compra.
 if(/(?:fatura|cartao\s+de\s+credito|pagamento\s+cartao)/.test(pluggyNorm(t.desc))){
   const cards=[];
   for(const c of S.car){
     for(const y of [mes,fm(mi(mes)-1)]){
       const v=fat(c)[mi(y)]||0;
       if(v>0&&Math.abs(v-t.valor)<.01&&Math.abs(new Date(dd({data:y+'-'+String(c.venc).padStart(2,'0')},y)+'T12:00:00')-new Date(t.data+'T12:00:00'))<=7*86400000) cards.push({c,y});
     }
   }
   if(cards.length===1){cards[0].c.pm=cards[0].c.pm||{};cards[0].c.pm[cards[0].y]=true;S.pluggyVinculos.push(t.ref);return 'vinculado';}
   return 'revisar';
 }
 return '';
}

 const code=$('#pluggyCode')?.value||window.pluggySessionCode||'';
 if(!/^https:\/\/[a-z0-9-]+\.leandrocmrg001\.workers\.dev$/i.test(url)||!code){window.pluggyMsg='Informe o endereço HTTPS e o código pessoal de acesso.';window.pluggyEndpoint=url;go();return}
 window.pluggyEndpoint=url;

 window.pluggyBusy=true;const btn=$('#pluggySync');if(btn){btn.disabled=true;btn.textContent='Buscando movimentações...';}

   const resp=await fetch(url+'/movimentacoes',{method:'POST',headers:{'Content-Type':'application/json','X-Access-Code':code},body:JSON.stringify({mes:ym}),cache:'no-store'});
   const out=await resp.json();if(!resp.ok)throw new Error(out.error||'Falha de comunicação com a Pluggy.');
   if(!Array.isArray(out.movimentacoes)||!Array.isArray(out.contas)||!out.contas.length)throw new Error('Resposta incompleta ou sem contas. Nenhum registro foi alterado.');
   if(out.movimentacoes.some(t=>!pluggyVal(t))||out.contas.some(c=>typeof c.id!=='string'||(c.saldo!=null&&!Number.isFinite(c.saldo))))throw new Error('Movimentações inconsistentes. Nenhum registro foi alterado.');
   const refs=new Set();if(out.movimentacoes.some(t=>{if(refs.has(t.ref))return true;refs.add(t.ref);return false}))throw new Error('Referências bancárias duplicadas.');
   let novas=0,vinculadas=0,especiais=0,existentes=0;
   // O snapshot de contas serve para EXIBIR saldo, não para somar com receitas.
   S.pluggySaldos=out.contas;S.pluggyConsulta=out.consultadoEm||new Date().toISOString();
   S.pluggyAtualizadoEm=out.ultimaAtualizacaoBanco||S.pluggyAtualizadoEm||null;
   for(const t of out.movimentacoes){
     if(pluggyExistente(t.ref)){existentes++;continue;}
     const conc=pluggyConciliar(t);
     if(conc==='vinculado'){vinculadas++;continue;}
     // Movimentações com natureza reconhecidamente não-operacional não geram renda/despesa.
     // Faturas não conciliadas também ficam isoladas para evitar dupla contagem.
     if(['transferencia_propria','aplicacao','fatura'].includes(t.natureza)||conc==='revisar'){
       S.pluggyNeutros.push({ref:t.ref});
       S.pluggyAvisos.push(t);especiais++;continue;
     }
     // PIX de terceiros e compras convencionais são importados automaticamente.
     pluggyAcumular(t);novas++;
   }
   const reorganizados=pluggyMigrarAntigos();save();window.pluggyUltimaConsulta=Date.now();window.pluggyMsg=`${novas} novo(s), ${vinculadas} conciliado(s), ${existentes} sem alteração, ${especiais} movimento(s) especial(is), ${reorganizados} importação(ões) antiga(s) reorganizada(s). Saldo consultado; veja a data da última atualização do banco.`;
 }catch(err){window.pluggyMsg='Não foi possível sincronizar: '+String(err.message||err);}
 finally{window.pluggyBusy=false;
window.pluggySessionCode="";
window.pluggyUltimaConsulta=0;go();}
}
// ---- formulários
function open_(h){$("#mb").innerHTML=h;$("#m").style.display="flex"}
const close_=()=>{$("#m").style.display="none"};
function add(k,it){const c=F[k],o=it||{};if(k==="cmp"&&!S.car.length)return open_("<p>Cadastre um cartão primeiro.</p><button class='btn' onclick='close_()'>OK</button>");
open_(`<h3>${it?"Editar":"Novo"}: ${c.t}</h3>`+c.f.map((f,i)=>{if(f[0]==="st"&&it)return"";let v=o[f[0]]??(f[2]==="date"?today:""),inp;
if(f[2]==="select")inp=`<select id="f${i}">${f[3].map(x=>{const a=Array.isArray(x)?x:[x,x];return`<option value="${E(a[0])}" ${String(v)===a[0]?"selected":""}>${E(a[1])}</option>`}).join("")}</select>`;
else if(f[2]==="card")inp=`<select id="f${i}">${S.car.map(x=>`<option value="${x.id}" ${v===x.id?"selected":""}>${E(x.nome)}</option>`).join("")}</select>`;
else inp=`<input id="f${i}" type="${f[2]}" ${f[2]==="number"?'step="0.01" inputmode="decimal"':""} value="${E(v)}" placeholder="${E(f[3]||"")}">`;
return`<label>${f[1]}</label>${inp}`}).join("")+`<div style="display:flex;gap:8px;margin-top:16px"><button class="btn" onclick="sv('${k}','${it?it.id:""}')">Salvar</button><button class="btn s" onclick="close_()">Cancelar</button></div>`)}
function sv(k,id){const c=F[k],o={};let ok=true;c.f.forEach((f,i)=>{const e=$("#f"+i);if(!e)return;let v=e.value.trim();if(f[2]==="number")v=v===""?0:parseFloat(v.replace(",","."));o[f[0]]=v});
const need=c.f[0][0];if(!o[need]&&o[need]!==0||o[need]==="")return er("Preencha o primeiro campo.");if(o.data===""||"data"in o&&!o.data)return er("Informe a data.");
if(["fech","venc"].some(x=>x in o)){o.fech=Math.min(28,Math.max(1,o.fech||1));o.venc=Math.min(28,Math.max(1,o.venc||1))}
const L=S[k];let it=id&&L.find(x=>x.id===id);if(it)Object.assign(it,o);else{it={id:uid(),...o,pm:{}};if(o.st==="1")it.pm[o.data.slice(0,7)]=true;if(k==="div"&&+it.pagas>0){}delete it.st;if(!it.pm)it.pm={};L.push(it)}delete it.st;save();close_();go()}
const edit=(k,id)=>add(k,S[k].find(x=>x.id===id));
function er(t){let e=$("#er");if(!e){e=document.createElement("p");e.id="er";e.style.color="var(--r)";$("#mb").appendChild(e)}e.textContent=t}
function del(k,id){const it=S[k].find(x=>x.id===id),rc=it&&(it.freq==="mensal"||it.freq==="anual"),B="display:block;width:100%;margin:6px 0;padding:10px";open_(`<h3>Excluir este lançamento?</h3><p class="ex">${E(it.desc||it.nome)}</p>`+(rc?`<button class="btn d" style="${B}" onclick="dl('${k}','${id}',1)">Excluir só deste mês</button>`:"")+`<button class="btn d" style="${B}" onclick="dl('${k}','${id}',0)">${rc?"Excluir em todos os meses":"Sim, excluir"}</button><button class="btn s" style="${B}" onclick="close_()">Cancelar</button>`)}
function dl(k,id,one){if(one){const it=S[k].find(x=>x.id===id);it.skip=it.skip||{};it.skip[ym]=true}else{if(k==="rec"||k==="var"||k==="fix"){
 const removida=S[k].find(x=>x.id===id);
 if(removida?.pluggyRef&&!S.pluggyIgnorados.includes(removida.pluggyRef))S.pluggyIgnorados.push(removida.pluggyRef);
}S[k]=S[k].filter(x=>x.id!==id);if(k==="car")S.cmp=S.cmp.filter(x=>x.cid!==id)}save();close_();go()}
function dep(id){const r=S.res.find(x=>x.id===id);r.atual=+r.atual+(+r.contrib||0);save();go()}
function addAny(){if(F[tab]&&tab!=="car")return add(tab);if(tab==="car")return add("car");open_("<h3>O que deseja adicionar?</h3>"+["rec","fix","var","car","cmp","div","res"].map(k=>`<button class="btn s" style="display:block;width:100%;margin:6px 0;padding:10px" onclick="close_();add('${k}')">${F[k].t}</button>`).join(""))}
async function exp(){const rows=[["Tipo","Descrição","Valor","Data","Categoria/Detalhe"]];S.rec.forEach(i=>rows.push(["Receita",i.desc,i.valor,D(i.data),i.cat]));S.fix.forEach(i=>rows.push(["Gasto fixo",i.desc,i.valor,D(i.data),i.cat]));S.var.forEach(i=>rows.push(["Gasto variável",i.desc,i.valor,D(i.data),i.cat]));S.cmp.forEach(i=>rows.push(["Compra no cartão",i.desc,i.valor,D(i.data),i.parc+"x"]));S.div.forEach(i=>rows.push(["Dívida",i.nome,i.parcela,D(i.data),i.pagas+"/"+i.total+" pagas"]));S.res.forEach(i=>rows.push(["Reserva",i.nome,i.atual,"","meta "+i.meta]));
const csv="\ufeff"+rows.map(r=>r.map(c=>'"'+String(c??"").replace(/"/g,'""')+'"').join(";")).join("\n");try{const d=await claude.use("downloads");if(!d)return alert("Download indisponível aqui.");await d.save({filename:"meu-controle-financeiro.csv",data:csv})}catch(e){}}
$("#ym").onchange=e=>{if(e.target.value){ym=e.target.value;go()}};
$("#m").onclick=e=>{if(e.target.id==="m")close_()};
// Atualiza a consulta ao retornar para a janela (não força atualização na instituição).
window.addEventListener('focus',()=>{
 if(window.pluggySessionCode&&!window.pluggyBusy&&window.pluggyUltimaConsulta&&Date.now()-window.pluggyUltimaConsulta>10*60*1000)sincronizarMeuPluggy();
});
go();
