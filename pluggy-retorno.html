<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Retorno da conexão bancária</title>
<style>body{font:16px system-ui,-apple-system,sans-serif;background:#f5f7f6;color:#203329;margin:0;display:grid;min-height:100vh;place-items:center}.box{background:white;border:1px solid #dae7de;padding:26px;border-radius:18px;max-width:420px;margin:16px;text-align:center}a{display:inline-block;background:#0b8a52;color:white;padding:12px 20px;border-radius:10px;text-decoration:none}p{line-height:1.5;color:#596a60}</style>
</head><body><main class="box"><h1>🏦 Voltando ao controle financeiro</h1><p>A autorização no banco terminou. A conexão ainda será conferida na Pluggy; este retorno, sozinho, não garante que deu certo.</p><a href="./?pluggy_retorno=1" id="back">Voltar ao Meu Controle Financeiro</a></main>
<script>
(function(){
  // Nunca repassar dados ou parâmetros vindos do banco ao site.
  if(window.opener && !window.opener.closed){
    try{window.opener.postMessage({type:'mcf-pluggy-oauth-return'},location.origin);window.close();}catch(_){ }
  }else{
    // Retorno na mesma aba, sem popup: retoma a plataforma.
    location.replace('./?pluggy_retorno=1');
  }
})();
</script></body></html>
